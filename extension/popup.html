<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Save to Shannon</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1 id="title">Save to Shannon</h1>
      <p id="status" role="status"></p>
      <p id="link-row" hidden><a id="review" href="#" target="_blank" rel="noreferrer"></a></p>
      <div id="base-row" hidden>
        <label id="base-label" for="base">Shannon address</label>
        <input id="base" name="base" type="url" spellcheck="false" placeholder="https://…" />
      </div>
      <label id="token-label" for="token">Save token</label>
      <input id="token" name="token" type="password" spellcheck="false" autocomplete="off" />
      <p id="shortcut" class="hint"></p>
    </main>
    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
